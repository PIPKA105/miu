name: Build GTA PORTS LAUNCHER APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create build com.foxai.gtaports "GTA PORTS LAUNCHER"
          rm -rf build/www
          cp -r www build/www
          cp config.xml build/config.xml

      - name: Make app icon
        run: |
          npm install sharp
          node -e "require('sharp')('icon.svg').resize(512,512).png().toFile('build/icon.png').then(()=>console.log('icon ok'))"

      - name: Add Android platform and plugins
        run: |
          cd build
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-whitelist
          cordova plugin add ../plugins/cordova-plugin-foxlaunch

      - name: Generate signing key
        run: keytool -genkeypair -v -keystore fox.keystore -alias fox -keyalg RSA -keysize 2048 -validity 10000 -storepass fox123456 -keypass fox123456 -dname "CN=FoxAI, O=FoxAI, C=RU"

      - name: Build release APK
        run: |
          cd build
          cordova build android --release -- --keystore="$GITHUB_WORKSPACE/fox.keystore" --storePassword=fox123456 --alias=fox --password=fox123456 --packageType=apk

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/platforms/android/app/build/outputs/apk/release/app-release.apk "out/GTA PORTS LAUNCHER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-PORTS-LAUNCHER
          path: out/GTA PORTS LAUNCHER.apk
          if-no-files-found: error
