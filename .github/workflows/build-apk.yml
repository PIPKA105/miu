              private void openAssignFunctionDialog(final CustomButtonConfig cfg, final boolean isNew) {
                  final String[] labels = {
                          "W (Вперёд / Газ)", "A (Влево)", "S (Назад / Тормоз)", "D (Вправо)",
                          "F (Сесть в авто)", "Y (Да / Действие)", "E (Действие)", "R (Радио)",
                          "C (Присесть)", "H (Сигнал)", "SPACE (Прыжок / Ручник)",
                          "SHIFT (Спринт)", "CTRL (Выстрел)", "ESC (Меню)", "ENTER (Ввод)",
                          "Л. клик мыши (ЛКМ)", "П. клик мыши (ПКМ)", "⌨️ Своя клавиша (ввести букву)"
                  };
                  new AlertDialog.Builder(this)
                          .setTitle("Функция для: " + cfg.name)
                          .setItems(labels, (d, idx) -> {
                              if (idx == labels.length - 1) {
                                  openCustomKeyInputDialog(cfg, isNew);
                                  return;
                              }
                              applyPreset(cfg, idx);
                              if (isNew) buttons.add(cfg);
                              saveButtons();
                              renderControls();
                              Toast.makeText(this, "Назначено: " + cfg.keyLabel, Toast.LENGTH_SHORT).show();
                          })
                          .setNegativeButton(cfg.removable && !isNew ? "Удалить кнопку" : "Отмена", (d, w) -> {
                              if (cfg.removable && !isNew) {
                                  buttons.remove(cfg);
                                  saveButtons();
                                  renderControls();
                              }
                          })
                          .show();
              }

              private void openCustomKeyInputDialog(final CustomButtonConfig cfg, final boolean isNew) {
                  final EditText input = new EditText(this);
                  input.setHint("Например: G, T, M, Z, X, 1");
                  new AlertDialog.Builder(this)
                          .setTitle("Введите любую клавишу")
                          .setView(input)
                          .setPositiveButton("Сохранить", (d, w) -> {
                              String txt = input.getText().toString().trim().toUpperCase();
                              if (!txt.isEmpty()) {
                                  char ch = txt.charAt(0);
                                  cfg.actionType = CustomButtonConfig.ACTION_KEY;
                                  cfg.keyLabel = String.valueOf(ch);
                                  cfg.jsCode = (ch >= '0' && ch <= '9') ? ("Digit" + ch) : ("Key" + ch);
                                  cfg.keyCode = (int) ch;
                                  if (ch >= 'A' && ch <= 'Z') {
                                      cfg.androidKeyCode = KeyEvent.KEYCODE_A + (ch - 'A');
                                  } else if (ch >= '0' && ch <= '9') {
                                      cfg.androidKeyCode = KeyEvent.KEYCODE_0 + (ch - '0');
                                  } else {
                                      cfg.androidKeyCode = 0;
                                  }
                                  if (isNew) buttons.add(cfg);
                                  saveButtons();
                                  renderControls();
                              }
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }

              private void applyPreset(CustomButtonConfig cfg, int idx) {
                  switch (idx) {
                      case 0: setKey(cfg, "W", "KeyW", 87, KeyEvent.KEYCODE_W); break;
                      case 1: setKey(cfg, "A", "KeyA", 65, KeyEvent.KEYCODE_A); break;
                      case 2: setKey(cfg, "S", "KeyS", 83, KeyEvent.KEYCODE_S); break;
                      case 3: setKey(cfg, "D", "KeyD", 68, KeyEvent.KEYCODE_D); break;
                      case 4: setKey(cfg, "F", "KeyF", 70, KeyEvent.KEYCODE_F); break;
                      case 5: setKey(cfg, "Y", "KeyY", 89, KeyEvent.KEYCODE_Y); break;
                      case 6: setKey(cfg, "E", "KeyE", 69, KeyEvent.KEYCODE_E); break;
                      case 7: setKey(cfg, "R", "KeyR", 82, KeyEvent.KEYCODE_R); break;
                      case 8: setKey(cfg, "C", "KeyC", 67, KeyEvent.KEYCODE_C); break;
                      case 9: setKey(cfg, "H", "KeyH", 72, KeyEvent.KEYCODE_H); break;
                      case 10: setKey(cfg, "SPACE", "Space", 32, KeyEvent.KEYCODE_SPACE); break;
                      case 11: setKey(cfg, "SHIFT", "ShiftLeft", 16, KeyEvent.KEYCODE_SHIFT_LEFT); break;
                      case 12: setKey(cfg, "CTRL", "ControlLeft", 17, KeyEvent.KEYCODE_CTRL_LEFT); break;
                      case 13: setKey(cfg, "ESC", "Escape", 27, KeyEvent.KEYCODE_ESCAPE); break;
                      case 14: setKey(cfg, "ENTER", "Enter", 13, KeyEvent.KEYCODE_ENTER); break;
                      case 15:
                          cfg.actionType = CustomButtonConfig.ACTION_MOUSE_LEFT;
                          cfg.keyLabel = "ЛКМ";
                          cfg.jsCode = "MouseLeft";
                          cfg.keyCode = 0;
                          cfg.androidKeyCode = 0;
                          break;
                      case 16:
                          cfg.actionType = CustomButtonConfig.ACTION_MOUSE_RIGHT;
                          cfg.keyLabel = "ПКМ";
                          cfg.jsCode = "MouseRight";
                          cfg.keyCode = 2;
                          cfg.androidKeyCode = 0;
                          break;
                  }
              }

              private void setKey(CustomButtonConfig cfg, String label, String code, int keyCode, int androidKeyCode) {
                  cfg.actionType = CustomButtonConfig.ACTION_KEY;
                  cfg.keyLabel = label;
                  cfg.jsCode = code;
                  cfg.keyCode = keyCode;
                  cfg.androidKeyCode = androidKeyCode;
              }

              private void saveButtons() {
                  prefs.edit().putString(KEY_BUTTONS, CustomButtonConfig.serializeList(buttons)).apply();
              }

              private Button makeMenuBtn(String text, int bgColor, int txtColor, View.OnClickListener listener) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setTextSize(13);
                  b.setTextColor(txtColor);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(bgColor);
                  bg.setCornerRadius(dp(16));
                  b.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(42));
                  lp.setMargins(0, 0, 0, dp(8));
                  b.setLayoutParams(lp);
                  b.setOnClickListener(listener);
                  return b;
              }

              private void handleJoystick(float x, float y) {
                  if (!webView.hasFocus()) webView.requestFocus();
                  float threshold = 0.30f;
                  String upCode = arrowMode ? "ArrowUp" : "KeyW";
                  int upKey = arrowMode ? 38 : 87;
                  int upAndroid = arrowMode ? KeyEvent.KEYCODE_DPAD_UP : KeyEvent.KEYCODE_W;

                  String downCode = arrowMode ? "ArrowDown" : "KeyS";
                  int downKey = arrowMode ? 40 : 83;
                  int downAndroid = arrowMode ? KeyEvent.KEYCODE_DPAD_DOWN : KeyEvent.KEYCODE_S;

                  String leftCode = arrowMode ? "ArrowLeft" : "KeyA";
                  int leftKey = arrowMode ? 37 : 65;
                  int leftAndroid = arrowMode ? KeyEvent.KEYCODE_DPAD_LEFT : KeyEvent.KEYCODE_A;

                  String rightCode = arrowMode ? "ArrowRight" : "KeyD";
                  int rightKey = arrowMode ? 39 : 68;
                  int rightAndroid = arrowMode ? KeyEvent.KEYCODE_DPAD_RIGHT : KeyEvent.KEYCODE_D;

                  updateKeyState(upCode, upKey, upAndroid, y < -threshold);
                  updateKeyState(downCode, downKey, downAndroid, y > threshold);
                  updateKeyState(leftCode, leftKey, leftAndroid, x < -threshold);
                  updateKeyState(rightCode, rightKey, rightAndroid, x > threshold);
              }

              private void updateKeyState(String code, int keyCode, int androidKey, boolean pressed) {
                  boolean wasPressed = activeKeys.contains(code);
                  if (pressed && !wasPressed) {
                      activeKeys.add(code);
                      activeAndroidKeys.put(code, androidKey);
                      dispatchNativeKey(true, androidKey);
                      sendJsKey("keydown", code, keyCode, null);
                  } else if (!pressed && wasPressed) {
                      activeKeys.remove(code);
                      Integer ak = activeAndroidKeys.remove(code);
                      if (ak != null) dispatchNativeKey(false, ak);
                      sendJsKey("keyup", code, keyCode, null);
                  }
              }

              private void releaseAllDirections() {
                  for (String code : new HashSet<>(activeKeys)) {
                      Integer ak = activeAndroidKeys.remove(code);
                      if (ak != null) dispatchNativeKey(false, ak);
                      sendJsKey("keyup", code, 0, null);
                  }
                  activeKeys.clear();
              }

              private void sendJsKey(String type, String code, int keyCode, String customLabel) {
                  String key = code.replace("Key", "").replace("Arrow", "");
                  if ("Space".equals(code)) key = " ";
                  else if ("ControlLeft".equals(code)) key = "Control";
                  else if ("ShiftLeft".equals(code)) key = "Shift";
                  else if ("Escape".equals(code)) key = "Escape";
                  else if ("Enter".equals(code)) key = "Enter";
                  else if (customLabel != null && customLabel.length() == 1) key = customLabel;

                  String js = "(function(){var c=document.querySelector('canvas');if(c&&c.focus)c.focus();var e=new KeyboardEvent('" + type + "',{key:'" + key + "',code:'" + code + "',keyCode:" + keyCode + ",which:" + keyCode + ",bubbles:true,cancelable:true,composed:true});document.dispatchEvent(e);window.dispatchEvent(e);if(c)c.dispatchEvent(e);})();";
                  webView.evaluateJavascript(js, null);
              }

              private void sendJsMouse(String type, int button) {
                  int buttonsMask = "mouseup".equals(type) ? 0 : (button == 2 ? 2 : 1);
                  String js = "(function(){var t=document.querySelector('canvas')||document.elementFromPoint(window.innerWidth/2,window.innerHeight/2)||document;var e=new MouseEvent('" + type + "',{button:" + button + ",buttons:" + buttonsMask + ",clientX:window.innerWidth/2,clientY:window.innerHeight/2,bubbles:true,cancelable:true,composed:true});t.dispatchEvent(e);})();";
                  webView.evaluateJavascript(js, null);
              }

              private boolean isLightColor(int color) {
                  double lum = (0.299 * Color.red(color) + 0.587 * Color.green(color) + 0.114 * Color.blue(color)) / 255.0;
                  return lum > 0.65;
              }

              private int dp(int val) {
                  return Math.round(val * getResources().getDisplayMetrics().density);
              }
          }
