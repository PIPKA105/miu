          (function(){var zone=el('joyZone'),base=el('joyBase'),thumb=el('joyThumb');function joyUpdate(e){var r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;var dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy),max=r.width/2-10;if(m>max){dx=dx/m*max;dy=dy/m*max;}thumb.style.transform='translate('+dx+'px,'+dy+'px)';if(Math.min(1,m/max)<.12){J.x=0;J.y=0;}else{J.x=dx/max;J.y=dy/max;}}zone.addEventListener('pointerdown',function(e){if(J.pid!==null)return;J.pid=e.pointerId;try{zone.setPointerCapture(e.pointerId);}catch(err){}base.classList.add('active');joyUpdate(e);e.preventDefault();});zone.addEventListener('pointermove',function(e){if(e.pointerId===J.pid)joyUpdate(e);});function joyEnd(e){if(e.pointerId!==J.pid)return;J.pid=null;J.x=0;J.y=0;thumb.style.transform='translate(0,0)';base.classList.remove('active');}zone.addEventListener('pointerup',joyEnd);zone.addEventListener('pointercancel',joyEnd);var nb=el('nitroBtn');nb.addEventListener('pointerdown',function(e){G.nitroOn=true;try{nb.setPointerCapture(e.pointerId);}catch(err){}e.preventDefault();});['pointerup','pointercancel'].forEach(function(ev){nb.addEventListener(ev,function(){G.nitroOn=false;});});function updKeys(){K.x=((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0);K.y=((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0);}window.addEventListener('keydown',function(e){var k=e.key.toLowerCase();keys[k]=true;if(k==='shift')G.nitroOn=true;if(overlayOpen&&k.indexOf('arrow')===0)e.preventDefault();if(k==='p'&&overlayOpen){if(G.state==='running')pauseGame();else if(G.state==='paused')resumeGame();}updKeys();});window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;if(e.key.toLowerCase()==='shift')G.nitroOn=false;updKeys();});window.addEventListener('resize',function(){if(overlayOpen)sizeCanvas();});document.addEventListener('visibilitychange',function(){if(document.hidden&&overlayOpen&&G.state==='running')pauseGame();});})();
          document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(t){var act=t.getAttribute('data-act'),id=t.getAttribute('data-id'),g=id?byId(id):null;if(S.sound)AudioFX.click();if(act==='fav')toggleFav(id);else if(act==='dl')doDownload(g);else if(act==='play')doPlay(g);else if(act==='info')openSheet(g);else if(act==='close-sheet')closeSheet();else if(act==='nav')switchView(t.getAttribute('data-view'));else if(act==='chip'){S.chip=t.getAttribute('data-chip');renderChips();renderCatalog();}else if(act==='sound')toggleSound();else if(act==='open-game')openGame();else if(act==='diff'){G.diff=t.getAttribute('data-diff');renderDiff();}else if(act==='vibro'){S.vibro=!S.vibro;store.set('vibro',S.vibro);renderDiff();}else if(act==='start-game')startRun();else if(act==='pause')pauseGame();else if(act==='resume')resumeGame();else if(act==='restart')startRun();else if(act==='exit-game')closeGame();else if(act==='link')openExternal(t.getAttribute('data-url'));else if(act==='tl'){S.q='';S.chip='all';el('searchInp').value='';renderChips();renderCatalog();var card=el('card-'+id);if(card){card.scrollIntoView({behavior:'smooth',block:'center'});card.classList.add('flash');setTimeout(function(){card.classList.remove('flash');},1600);}}return;}var card=e.target.closest('.card');if(card)openSheet(byId(card.getAttribute('data-id')));});
          var searchTimer=0;el('searchInp').addEventListener('input',function(){var v=this.value;clearTimeout(searchTimer);searchTimer=setTimeout(function(){S.q=v;renderCatalog();},120);});el('sortSel').addEventListener('change',function(){S.sort=this.value;renderCatalog();});
          document.addEventListener('pointerdown',function firstTouch(){AudioFX.init();AudioFX.resume();document.removeEventListener('pointerdown',firstTouch);});
          document.addEventListener('deviceready',function(){refreshInstalled();},false);
          document.addEventListener('resume',function(){refreshInstalled();},false);
          el('gamePoster').innerHTML=coverSVG(FOXPOSTER);
          el('soundBtn').classList.toggle('muted',!S.sound);
          renderTimeline();renderCatalog();renderFavs();renderRuns();renderBest();updateBadges();observeReveals(document);
          </script>
          </body>
          </html>
          FOX_HTML

      - name: Generate icon PNG
        run: |
          npm install sharp
          node -e "require('sharp')('icon.svg').resize(512,512).png().toFile('build/icon.png').then(()=>console.log('icon ok')).catch(e=>{console.log('icon skip',e.message)})"
          if [ ! -f build/icon.png ]; then sed -i '/<icon/d' build/config.xml; fi

      - name: Add Android platform and plugins
        run: |
          cd build
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-whitelist
          cordova plugin add "$GITHUB_WORKSPACE/foxplugin"

      - name: Generate signing key
        run: keytool -genkeypair -v -keystore fox.keystore -alias fox -keyalg RSA -keysize 2048 -validity 10000 -storepass fox123456 -keypass fox123456 -dname "CN=FoxAI, O=FoxAI, C=RU"

      - name: Build release APK
        run: |
          cd build
          cordova build android --release -- --keystore="$GITHUB_WORKSPACE/fox.keystore" --storePassword=fox123456 --alias=fox --password=fox123456 --packageType=apk

      - name: Rename APK
        run: |
          mkdir -p out
          cp build/platforms/android/app/build/outputs/apk/release/app-release.apk "out/GTA PORTS LAUNCHER.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA-PORTS-LAUNCHER
          path: out/GTA PORTS LAUNCHER.apk
          if-no-files-found: error
