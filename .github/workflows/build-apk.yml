          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/CustomButtonConfig.java
          package com.gtaports.launcher;

          import android.view.KeyEvent;
          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.util.ArrayList;
          import java.util.List;

          public class CustomButtonConfig {
              public static final String ACTION_KEY = "KEY";
              public static final String ACTION_MOUSE_LEFT = "MOUSE_LEFT";
              public static final String ACTION_MOUSE_RIGHT = "MOUSE_RIGHT";

              public String id;
              public String name;
              public int color;
              public String actionType;
              public String keyLabel;
              public String jsCode;
              public int keyCode;
              public int androidKeyCode;
              public float xFraction;
              public float yFraction;
              public boolean removable;

              public CustomButtonConfig(String id, String name, int color, String actionType,
                                        String keyLabel, String jsCode, int keyCode, int androidKeyCode,
                                        float xFraction, float yFraction, boolean removable) {
                  this.id = id;
                  this.name = name;
                  this.color = color;
                  this.actionType = actionType;
                  this.keyLabel = keyLabel;
                  this.jsCode = jsCode;
                  this.keyCode = keyCode;
                  this.androidKeyCode = androidKeyCode;
                  this.xFraction = xFraction;
                  this.yFraction = yFraction;
                  this.removable = removable;
              }

              public JSONObject toJson() {
                  JSONObject o = new JSONObject();
                  try {
                      o.put("id", id);
                      o.put("name", name);
                      o.put("color", color);
                      o.put("actionType", actionType);
                      o.put("keyLabel", keyLabel);
                      o.put("jsCode", jsCode);
                      o.put("keyCode", keyCode);
                      o.put("androidKeyCode", androidKeyCode);
                      o.put("xFraction", xFraction);
                      o.put("yFraction", yFraction);
                      o.put("removable", removable);
                  } catch (Exception ignored) {}
                  return o;
              }

              public static CustomButtonConfig fromJson(JSONObject o) {
                  return new CustomButtonConfig(
                          o.optString("id", "btn"),
                          o.optString("name", "Кнопка"),
                          o.optInt("color", 0xFFFB7185),
                          o.optString("actionType", ACTION_KEY),
                          o.optString("keyLabel", "F"),
                          o.optString("jsCode", "KeyF"),
                          o.optInt("keyCode", 70),
                          o.optInt("androidKeyCode", KeyEvent.KEYCODE_F),
                          (float) o.optDouble("xFraction", 0.2),
                          (float) o.optDouble("yFraction", 0.5),
                          o.optBoolean("removable", false)
                  );
              }

              public static List<CustomButtonConfig> defaults() {
                  List<CustomButtonConfig> list = new ArrayList<>();
                  list.add(new CustomButtonConfig(
                          "red_top", "Красная (верх)", 0xFFFF6B6B,
                          ACTION_KEY, "F", "KeyF", 70, KeyEvent.KEYCODE_F, 0.14f, 0.44f, false
                  ));
                  list.add(new CustomButtonConfig(
                          "blue_left", "Синяя (лево)", 0xFF0EA5E9,
                          ACTION_MOUSE_LEFT, "ЛКМ", "MouseLeft", 0, 0, 0.07f, 0.58f, false
                  ));
                  list.add(new CustomButtonConfig(
                          "green_right", "Зелёная (право)", 0xFFBDF55A,
                          ACTION_KEY, "SPACE", "Space", 32, KeyEvent.KEYCODE_SPACE, 0.21f, 0.58f, false
                  ));
                  list.add(new CustomButtonConfig(
                          "orange_bottom", "Оранжевая (низ)", 0xFFF59E0B,
                          ACTION_KEY, "SHIFT", "ShiftLeft", 16, KeyEvent.KEYCODE_SHIFT_LEFT, 0.14f, 0.72f, false
                  ));
                  return list;
              }

              public static String serializeList(List<CustomButtonConfig> list) {
                  JSONArray arr = new JSONArray();
                  for (CustomButtonConfig c : list) arr.put(c.toJson());
                  return arr.toString();
              }

              public static List<CustomButtonConfig> deserializeList(String json) {
                  if (json == null || json.isEmpty()) return defaults();
                  try {
                      JSONArray arr = new JSONArray(json);
                      List<CustomButtonConfig> list = new ArrayList<>();
                      for (int i = 0; i < arr.length(); i++) {
                          list.add(fromJson(arr.getJSONObject(i)));
                      }
                      return list.isEmpty() ? defaults() : list;
                  } catch (Exception e) {
                      return defaults();
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/VirtualJoystickView.java
          package com.gtaports.launcher;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.MotionEvent;
          import android.view.View;

          public class VirtualJoystickView extends View {
              public interface JoystickListener {
                  void onJoystickMoved(float xPercent, float yPercent);
              }

              private final Paint baseFill = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint outerRing = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint innerRing = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint hatFill = new Paint(Paint.ANTI_ALIAS_FLAG);

              private float centerX;
              private float centerY;
              private float baseRadius;
              private float hatRadius;
              private float hatX;
              private float hatY;
              private JoystickListener listener;

              public VirtualJoystickView(Context context) {
                  super(context);
                  setFocusable(false);
                  setFocusableInTouchMode(false);

                  baseFill.setColor(Color.argb(40, 255, 255, 255));
                  baseFill.setStyle(Paint.Style.FILL);

                  outerRing.setColor(Color.argb(190, 148, 163, 184));
                  outerRing.setStyle(Paint.Style.STROKE);
                  outerRing.setStrokeWidth(5f);

                  hatFill.setColor(Color.argb(65, 255, 255, 255));
                  hatFill.setStyle(Paint.Style.FILL);

                  innerRing.setColor(Color.argb(220, 148, 163, 184));
                  innerRing.setStyle(Paint.Style.STROKE);
                  innerRing.setStrokeWidth(5f);
              }

              public void setJoystickListener(JoystickListener listener) {
                  this.listener = listener;
              }

              @Override
              protected void onSizeChanged(int w, int h, int oldw, int oldh) {
                  super.onSizeChanged(w, h, oldw, oldh);
                  centerX = w / 2f;
                  centerY = h / 2f;
                  float minDim = Math.min(w, h);
                  baseRadius = minDim * 0.40f;
                  hatRadius = minDim * 0.16f;
                  hatX = centerX;
                  hatY = centerY;
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  canvas.drawCircle(centerX, centerY, baseRadius, baseFill);
                  canvas.drawCircle(centerX, centerY, baseRadius, outerRing);
                  canvas.drawCircle(hatX, hatY, hatRadius, hatFill);
                  canvas.drawCircle(hatX, hatY, hatRadius, innerRing);
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  int action = event.getActionMasked();
                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_MOVE) {
                      float dx = event.getX() - centerX;
                      float dy = event.getY() - centerY;
                      float dist = (float) Math.hypot(dx, dy);
                      if (dist > baseRadius && dist > 0) {
                          hatX = centerX + (dx / dist) * baseRadius;
                          hatY = centerY + (dy / dist) * baseRadius;
                      } else {
                          hatX = event.getX();
                          hatY = event.getY();
                      }
                      invalidate();
                      if (listener != null && baseRadius > 0) {
                          listener.onJoystickMoved((hatX - centerX) / baseRadius, (hatY - centerY) / baseRadius);
                      }
                      return true;
                  } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      hatX = centerX;
                      hatY = centerY;
                      invalidate();
                      if (listener != null) {
                          listener.onJoystickMoved(0f, 0f);
                      }
                      return true;
                  }
                  return super.onTouchEvent(event);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/MainActivity.java
          package com.gtaports.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.List;

          public class MainActivity extends Activity {
              private static final String PREFS = "gta_ports_prefs";
              private SharedPreferences prefs;
              private LinearLayout listContainer;
              private String currentFilter = "all";
              private WebView preloadWebView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private Button btnAll, btnMobile, btnDesktop;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  preloadWebView = new WebView(this);
                  WebSettings ws = preloadWebView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF0E1118);
                  root.setPadding(dp(18), dp(22), dp(18), dp(12));

                  LinearLayout headerCard = new LinearLayout(this);
                  headerCard.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable headerBg = new GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF172234, 0xFF121622}
                  );
                  headerBg.setCornerRadius(dp(24));
                  headerBg.setStroke(dp(1), 0xFF28354D);
                  headerCard.setBackground(headerBg);
                  headerCard.setPadding(dp(18), dp(16), dp(18), dp(16));

                  TextView chip = new TextView(this);
                  chip.setText("COLOR OS GAME SPACE • INXANITY LABS");
                  chip.setTextColor(0xFF00D296);
                  chip.setTextSize(11);
                  chip.setTypeface(Typeface.DEFAULT_BOLD);
                  headerCard.addView(chip);

                  TextView title = new TextView(this);
                  title.setText("GTA PORTS LAUNCHER");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  title.setPadding(0, dp(4), 0, dp(2));
                  headerCard.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("Полноэкранный запуск • Настраиваемый джойстик и кнопки");
                  sub.setTextColor(0xFF94A3B8);
                  sub.setTextSize(13);
                  headerCard.addView(sub);

                  LinearLayout.LayoutParams hLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  hLp.setMargins(0, 0, 0, dp(14));
                  root.addView(headerCard, hLp);

                  LinearLayout filterRow = new LinearLayout(this);
                  filterRow.setOrientation(LinearLayout.HORIZONTAL);
                  filterRow.setPadding(0, 0, 0, dp(14));
                  btnAll = makeFilterBtn("Все (8)", "all");
                  btnMobile = makeFilterBtn("Телефон", "mobile");
                  btnDesktop = makeFilterBtn("ПК-режим", "desktop");
                  filterRow.addView(btnAll);
                  filterRow.addView(btnMobile);
                  filterRow.addView(btnDesktop);
                  root.addView(filterRow);

                  ScrollView scroll = new ScrollView(this);
                  scroll.setVerticalScrollBarEnabled(false);
                  listContainer = new LinearLayout(this);
                  listContainer.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(listContainer);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);
                  updateFilterStyles();
                  renderPorts();
              }

              private Button makeFilterBtn(String label, final String filterKey) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(13);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-medium", Typeface.NORMAL));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, dp(38));
                  lp.setMargins(0, 0, dp(8), 0);
                  b.setLayoutParams(lp);
                  b.setPadding(dp(16), 0, dp(16), 0);
                  b.setOnClickListener(v -> {
                      currentFilter = filterKey;
                      updateFilterStyles();
                      renderPorts();
                  });
                  return b;
              }

              private void updateFilterStyles() {
                  styleFilter(btnAll, "all".equals(currentFilter));
                  styleFilter(btnMobile, "mobile".equals(currentFilter));
                  styleFilter(btnDesktop, "desktop".equals(currentFilter));
              }

              private void styleFilter(Button b, boolean active) {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(dp(20));
                  if (active) {
                      bg.setColor(0xFF00D296);
                      b.setTextColor(0xFF06120E);
                  } else {
                      bg.setColor(0xFF1A202E);
                      bg.setStroke(dp(1), 0xFF283146);
                      b.setTextColor(0xFFCBD5E1);
                  }
                  b.setBackground(bg);
              }

              private void renderPorts() {
                  listContainer.removeAllViews();
                  List<PortInfo> ports = PortCatalog.getVerifiedPorts();
                  for (PortInfo port : ports) {
                      if ("mobile".equals(currentFilter) && !port.mobileReady) continue;
                      if ("desktop".equals(currentFilter) && port.mobileReady) continue;
                      listContainer.addView(createPortCard(port));
                  }
              }

              private View createPortCard(final PortInfo port) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(0xFF161B26);
                  cardBg.setCornerRadius(dp(22));
                  cardBg.setStroke(dp(1), 0xFF262F42);
                  card.setBackground(cardBg);
                  card.setPadding(dp(18), dp(16), dp(18), dp(16));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 0, 0, dp(12));
                  card.setLayoutParams(lp);

                  TextView badge = new TextView(this);
                  badge.setText(port.badge);
                  badge.setTextColor(port.accentColor);
                  badge.setTextSize(11);
                  badge.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(badge);

                  TextView name = new TextView(this);
                  name.setText(port.title);
                  name.setTextColor(Color.WHITE);
                  name.setTextSize(19);
                  name.setTypeface(Typeface.create("sans-serif-medium", Typeface.BOLD));
                  name.setPadding(0, dp(4), 0, dp(4));
                  card.addView(name);

                  TextView desc = new TextView(this);
                  desc.setText(port.subtitle);
                  desc.setTextColor(0xFF94A3B8);
                  desc.setTextSize(13);
                  desc.setPadding(0, 0, 0, dp(10));
                  card.addView(desc);

                  final boolean isCached = prefs.getBoolean("cached_" + port.id, false);
                  final TextView statusView = new TextView(this);
                  statusView.setText(isCached ? "● Кэшировано и готово" : "○ Не скачано");
                  statusView.setTextColor(isCached ? 0xFF00D296 : 0xFF64748B);
                  statusView.setTextSize(12);
                  statusView.setPadding(0, 0, 0, dp(12));
                  card.addView(statusView);

                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  btnRow.setGravity(Gravity.CENTER_VERTICAL);

                  final Button downloadBtn = new Button(this);
                  downloadBtn.setText(isCached ? "Обновить" : "Скачать");
                  downloadBtn.setAllCaps(false);
                  downloadBtn.setTextColor(Color.WHITE);
                  downloadBtn.setTextSize(14);
                  GradientDrawable dlBg = new GradientDrawable();
                  dlBg.setColor(0xFF222A3A);
                  dlBg.setCornerRadius(dp(18));
                  downloadBtn.setBackground(dlBg);
