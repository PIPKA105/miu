              private void renderControls() {
                  controlsOverlay.removeAllViews();
                  int w = rootLayout.getWidth();
                  int h = rootLayout.getHeight();
                  if (w <= 0 || h <= 0) return;

                  joystickView = new VirtualJoystickView(this);
                  int joySize = dp(170);
                  FrameLayout.LayoutParams joyLp = new FrameLayout.LayoutParams(joySize, joySize);
                  joyLp.gravity = Gravity.BOTTOM | Gravity.END;
                  joyLp.rightMargin = dp(24);
                  joyLp.bottomMargin = dp(18);
                  joystickView.setJoystickListener(this::handleJoystick);
                  controlsOverlay.addView(joystickView, joyLp);

                  int btnSize = dp(54);
                  for (final CustomButtonConfig cfg : buttons) {
                      Button btn = new Button(this);
                      btn.setFocusable(false);
                      btn.setFocusableInTouchMode(false);
                      btn.setText(cfg.keyLabel);
                      btn.setTextSize(11);
                      btn.setAllCaps(false);
                      btn.setTypeface(Typeface.DEFAULT_BOLD);
                      btn.setTextColor(isLightColor(cfg.color) ? 0xFF0F172A : Color.WHITE);
                      btn.setPadding(0, 0, 0, 0);

                      GradientDrawable circle = new GradientDrawable();
                      circle.setShape(GradientDrawable.OVAL);
                      circle.setColor(Color.argb(215, Color.red(cfg.color), Color.green(cfg.color), Color.blue(cfg.color)));
                      circle.setStroke(dp(3), 0xFF0B0D14);
                      btn.setBackground(circle);

                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(btnSize, btnSize);
                      lp.leftMargin = Math.max(0, Math.min(w - btnSize, Math.round(cfg.xFraction * w)));
                      lp.topMargin = Math.max(0, Math.min(h - btnSize, Math.round(cfg.yFraction * h)));
                      btn.setLayoutParams(lp);

                      btn.setOnTouchListener(new View.OnTouchListener() {
                          float dX, dY;
                          @Override
                          public boolean onTouch(View v, MotionEvent event) {
                              if (editDragMode) {
                                  FrameLayout.LayoutParams p = (FrameLayout.LayoutParams) v.getLayoutParams();
                                  switch (event.getActionMasked()) {
                                      case MotionEvent.ACTION_DOWN:
                                          dX = p.leftMargin - event.getRawX();
                                          dY = p.topMargin - event.getRawY();
                                          return true;
                                      case MotionEvent.ACTION_MOVE:
                                          int nx = Math.max(0, Math.min(w - btnSize, Math.round(event.getRawX() + dX)));
                                          int ny = Math.max(0, Math.min(h - btnSize, Math.round(event.getRawY() + dY)));
                                          p.leftMargin = nx;
                                          p.topMargin = ny;
                                          v.setLayoutParams(p);
                                          cfg.xFraction = (float) nx / w;
                                          cfg.yFraction = (float) ny / h;
                                          return true;
                                      case MotionEvent.ACTION_UP:
                                          saveButtons();
                                          return true;
                                  }
                                  return true;
                              }

                              if (event.getActionMasked() == MotionEvent.ACTION_DOWN) {
                                  v.setAlpha(0.6f);
                                  triggerConfigAction(cfg, true);
                                  return true;
                              } else if (event.getActionMasked() == MotionEvent.ACTION_UP || event.getActionMasked() == MotionEvent.ACTION_CANCEL) {
                                  v.setAlpha(1.0f);
                                  triggerConfigAction(cfg, false);
                                  return true;
                              }
                              return false;
                          }
                      });
                      controlsOverlay.addView(btn);
                  }
              }

              private void triggerConfigAction(CustomButtonConfig cfg, boolean down) {
                  if (!webView.hasFocus()) webView.requestFocus();
                  if (CustomButtonConfig.ACTION_MOUSE_LEFT.equals(cfg.actionType)) {
                      dispatchNativeTap(down);
                      sendJsMouse(down ? "mousedown" : "mouseup", 0);
                      if (!down) sendJsMouse("click", 0);
                  } else if (CustomButtonConfig.ACTION_MOUSE_RIGHT.equals(cfg.actionType)) {
                      sendJsMouse(down ? "mousedown" : "mouseup", 2);
                      if (!down) sendJsMouse("contextmenu", 2);
                  } else {
                      dispatchNativeKey(down, cfg.androidKeyCode);
                      sendJsKey(down ? "keydown" : "keyup", cfg.jsCode, cfg.keyCode, cfg.keyLabel);
                  }
              }

              private void dispatchNativeKey(boolean down, int androidKeyCode) {
                  if (androidKeyCode <= 0) return;
                  long now = SystemClock.uptimeMillis();
                  int action = down ? KeyEvent.ACTION_DOWN : KeyEvent.ACTION_UP;
                  KeyEvent ev = new KeyEvent(
                          now, now, action, androidKeyCode, 0, 0,
                          KeyCharacterMap.VIRTUAL_KEYBOARD, 0,
                          KeyEvent.FLAG_FROM_SYSTEM, InputDevice.SOURCE_KEYBOARD
                  );
                  webView.dispatchKeyEvent(ev);
              }

              private void dispatchNativeTap(boolean down) {
                  long now = SystemClock.uptimeMillis();
                  float cx = webView.getWidth() / 2f;
                  float cy = webView.getHeight() / 2f;
                  int action = down ? MotionEvent.ACTION_DOWN : MotionEvent.ACTION_UP;
                  MotionEvent ev = MotionEvent.obtain(now, now, action, cx, cy, 0);
                  webView.dispatchTouchEvent(ev);
                  ev.recycle();
              }

