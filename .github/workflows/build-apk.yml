          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/VirtualJoystickView.java
          package com.gtaports.launcher;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.view.MotionEvent;
          import android.view.View;

          public class VirtualJoystickView extends View {
              public interface JoystickListener {
                  void onJoystickMoved(float xPercent, float yPercent);
              }

              private final Paint basePaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint borderPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint hatPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint hatStrokePaint = new Paint(Paint.ANTI_ALIAS_FLAG);

              private float centerX;
              private float centerY;
              private float baseRadius;
              private float hatRadius;
              private float hatX;
              private float hatY;
              private JoystickListener listener;

              public VirtualJoystickView(Context context) {
                  super(context);
                  basePaint.setColor(Color.argb(110, 15, 23, 42));
                  basePaint.setStyle(Paint.Style.FILL);

                  borderPaint.setColor(Color.argb(190, 56, 189, 248));
                  borderPaint.setStyle(Paint.Style.STROKE);
                  borderPaint.setStrokeWidth(4f);

                  hatPaint.setColor(Color.argb(210, 56, 189, 248));
                  hatPaint.setStyle(Paint.Style.FILL);

                  hatStrokePaint.setColor(Color.WHITE);
                  hatStrokePaint.setStyle(Paint.Style.STROKE);
                  hatStrokePaint.setStrokeWidth(3f);
              }

              public void setJoystickListener(JoystickListener listener) {
                  this.listener = listener;
              }

              @Override
              protected void onSizeChanged(int w, int h, int oldw, int oldh) {
                  super.onSizeChanged(w, h, oldw, oldh);
                  centerX = w / 2f;
                  centerY = h / 2f;
                  float minDim = Math.min(w, h);
                  baseRadius = minDim * 0.36f;
                  hatRadius = minDim * 0.16f;
                  hatX = centerX;
                  hatY = centerY;
              }

              @Override
              protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas);
                  canvas.drawCircle(centerX, centerY, baseRadius, basePaint);
                  canvas.drawCircle(centerX, centerY, baseRadius, borderPaint);
                  canvas.drawCircle(hatX, hatY, hatRadius, hatPaint);
                  canvas.drawCircle(hatX, hatY, hatRadius, hatStrokePaint);
              }

              @Override
              public boolean onTouchEvent(MotionEvent event) {
                  int action = event.getActionMasked();
                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_MOVE) {
                      float dx = event.getX() - centerX;
                      float dy = event.getY() - centerY;
                      float dist = (float) Math.hypot(dx, dy);
                      if (dist > baseRadius && dist > 0) {
                          hatX = centerX + (dx / dist) * baseRadius;
                          hatY = centerY + (dy / dist) * baseRadius;
                      } else {
                          hatX = event.getX();
                          hatY = event.getY();
                      }
                      invalidate();
                      if (listener != null && baseRadius > 0) {
                          listener.onJoystickMoved((hatX - centerX) / baseRadius, (hatY - centerY) / baseRadius);
                      }
                      return true;
                  } else if (action == MotionEvent.ACTION_UP || action == MotionEvent.ACTION_CANCEL) {
                      hatX = centerX;
                      hatY = centerY;
                      invalidate();
                      if (listener != null) {
                          listener.onJoystickMoved(0f, 0f);
                      }
                      return true;
                  }
                  return super.onTouchEvent(event);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/MainActivity.java
          package com.gtaports.launcher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.List;

          public class MainActivity extends Activity {
              private static final String PREFS = "gta_ports_prefs";
              private SharedPreferences prefs;
              private LinearLayout listContainer;
              private String currentFilter = "all";
              private WebView preloadWebView;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);

                  preloadWebView = new WebView(this);
                  WebSettings ws = preloadWebView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setDatabaseEnabled(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(0xFF0B0D14);
                  root.setPadding(dp(16), dp(20), dp(16), dp(12));

                  TextView title = new TextView(this);
                  title.setText("GTA PORTS LAUNCHER");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  root.addView(title);

                  TextView sub = new TextView(this);
                  sub.setText("Проверенные веб-порты с inxanitylabs.com • Экранный джойстик");
                  sub.setTextColor(0xFF94A3B8);
                  sub.setTextSize(13);
                  sub.setPadding(0, dp(4), 0, dp(14));
                  root.addView(sub);

                  LinearLayout filterRow = new LinearLayout(this);
                  filterRow.setOrientation(LinearLayout.HORIZONTAL);
                  filterRow.setPadding(0, 0, 0, dp(12));
                  filterRow.addView(makeFilterBtn("Все (8)", "all"));
                  filterRow.addView(makeFilterBtn("Для телефона", "mobile"));
                  filterRow.addView(makeFilterBtn("ПК-режим", "desktop"));
                  root.addView(filterRow);

                  ScrollView scroll = new ScrollView(this);
                  listContainer = new LinearLayout(this);
                  listContainer.setOrientation(LinearLayout.VERTICAL);
                  scroll.addView(listContainer);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  setContentView(root);
                  renderPorts();
              }

              private Button makeFilterBtn(String label, final String filterKey) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(12);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0xFF1E293B);
                  bg.setCornerRadius(dp(16));
                  b.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, dp(36));
                  lp.setMargins(0, 0, dp(8), 0);
                  b.setLayoutParams(lp);
                  b.setPadding(dp(14), 0, dp(14), 0);
                  b.setOnClickListener(v -> {
                      currentFilter = filterKey;
                      renderPorts();
                  });
                  return b;
              }

              private void renderPorts() {
                  listContainer.removeAllViews();
                  List<PortInfo> ports = PortCatalog.getVerifiedPorts();
                  for (PortInfo port : ports) {
                      if ("mobile".equals(currentFilter) && !port.mobileReady) continue;
                      if ("desktop".equals(currentFilter) && port.mobileReady) continue;
                      listContainer.addView(createPortCard(port));
                  }
              }

              private View createPortCard(final PortInfo port) {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable cardBg = new GradientDrawable();
                  cardBg.setColor(0xFF131722);
                  cardBg.setCornerRadius(dp(14));
                  cardBg.setStroke(dp(1), 0xFF263044);
                  card.setBackground(cardBg);
                  card.setPadding(dp(16), dp(14), dp(16), dp(14));

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 0, 0, dp(12));
                  card.setLayoutParams(lp);

                  TextView badge = new TextView(this);
                  badge.setText(port.badge);
                  badge.setTextColor(port.accentColor);
                  badge.setTextSize(11);
                  badge.setTypeface(Typeface.DEFAULT_BOLD);
                  card.addView(badge);

                  TextView name = new TextView(this);
                  name.setText(port.title);
                  name.setTextColor(Color.WHITE);
                  name.setTextSize(18);
                  name.setTypeface(Typeface.DEFAULT_BOLD);
                  name.setPadding(0, dp(4), 0, dp(4));
                  card.addView(name);

                  TextView desc = new TextView(this);
                  desc.setText(port.subtitle);
                  desc.setTextColor(0xFFCBD5E1);
                  desc.setTextSize(13);
                  desc.setPadding(0, 0, 0, dp(10));
                  card.addView(desc);

                  final boolean isCached = prefs.getBoolean("cached_" + port.id, false);
                  final TextView statusView = new TextView(this);
                  statusView.setText(isCached ? "Статус: Кэшировано ✓ (готово к запуску)" : "Статус: Не скачано");
                  statusView.setTextColor(isCached ? 0xFF4ADE80 : 0xFF94A3B8);
                  statusView.setTextSize(12);
                  statusView.setPadding(0, 0, 0, dp(10));
                  card.addView(statusView);

                  LinearLayout btnRow = new LinearLayout(this);
                  btnRow.setOrientation(LinearLayout.HORIZONTAL);
                  btnRow.setGravity(Gravity.CENTER_VERTICAL);

                  final Button downloadBtn = new Button(this);
                  downloadBtn.setText(isCached ? "Обновить кэш" : "Скачать");
                  downloadBtn.setAllCaps(false);
                  downloadBtn.setTextColor(Color.WHITE);
                  GradientDrawable dlBg = new GradientDrawable();
                  dlBg.setColor(0xFF1E293B);
                  dlBg.setCornerRadius(dp(10));
                  downloadBtn.setBackground(dlBg);
                  LinearLayout.LayoutParams dlLp = new LinearLayout.LayoutParams(0, dp(42), 1f);
                  dlLp.setMargins(0, 0, dp(8), 0);
                  downloadBtn.setLayoutParams(dlLp);

                  downloadBtn.setOnClickListener(v -> {
                      statusView.setText("Статус: Загрузка файлов порта...");
                      statusView.setTextColor(0xFFFBBF24);
                      downloadBtn.setEnabled(false);
                      preloadWebView.setWebViewClient(new WebViewClient() {
                          @Override
                          public void onPageFinished(WebView view, String url) {
                              prefs.edit().putBoolean("cached_" + port.id, true).apply();
                              mainHandler.post(() -> {
                                  statusView.setText("Статус: Кэшировано ✓ (готово к запуску)");
                                  statusView.setTextColor(0xFF4ADE80);
                                  downloadBtn.setText("Обновить кэш");
                                  downloadBtn.setEnabled(true);
                                  Toast.makeText(MainActivity.this, port.title + " готов к запуску!", Toast.LENGTH_SHORT).show();
                              });
                          }
                      });
                      preloadWebView.loadUrl(port.url);
                  });

                  Button playBtn = new Button(this);
                  playBtn.setText("▶ Играть");
                  playBtn.setAllCaps(false);
                  playBtn.setTextColor(Color.WHITE);
                  playBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  GradientDrawable playBg = new GradientDrawable();
                  playBg.setColor(port.accentColor);
                  playBg.setCornerRadius(dp(10));
                  playBtn.setBackground(playBg);
                  LinearLayout.LayoutParams playLp = new LinearLayout.LayoutParams(0, dp(42), 1f);
                  playBtn.setLayoutParams(playLp);

                  playBtn.setOnClickListener(v -> {
                      Intent intent = new Intent(MainActivity.this, GameActivity.class);
                      intent.putExtra("title", port.title);
                      intent.putExtra("url", port.url);
                      intent.putExtra("id", port.id);
                      intent.putExtra("desktopUa", port.defaultDesktopUa);
                      startActivity(intent);
                  });

                  btnRow.addView(downloadBtn);
                  btnRow.addView(playBtn);
                  card.addView(btnRow);
                  return card;
              }

              private int dp(int val) {
                  return Math.round(val * getResources().getDisplayMetrics().density);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/gtaports/launcher/GameActivity.java
          package com.gtaports.launcher;

          import android.app.Activity;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;

          import java.util.HashSet;
          import java.util.Set;

          public class GameActivity extends Activity {
              private static final String DESKTOP_UA =
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";

              private WebView webView;
              private FrameLayout controlsOverlay;
              private boolean joystickVisible = true;
              private boolean arrowMode = false;
              private boolean desktopUa = false;
              private String portUrl;
              private final Set<String> activeKeys = new HashSet<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  portUrl = getIntent().getStringExtra("url");
                  String portId = getIntent().getStringExtra("id");
                  desktopUa = getIntent().getBooleanExtra("desktopUa", false);

                  SharedPreferences prefs = getSharedPreferences("gta_ports_prefs", MODE_PRIVATE);
                  boolean cached = prefs.getBoolean("cached_" + portId, false);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  webView = new WebView(this);
                  configureWebView(cached);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  controlsOverlay = new FrameLayout(this);
                  buildVirtualControls();
                  root.addView(controlsOverlay, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  LinearLayout topBar = buildTopToolbar();
                  FrameLayout.LayoutParams barLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  barLp.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  barLp.topMargin = dp(8);
                  root.addView(topBar, barLp);

                  setContentView(root);
                  hideSystemUi();

                  if (portUrl != null) {
                      webView.loadUrl(portUrl);
                  }
              }

              private void configureWebView(boolean cached) {
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setCacheMode(cached ? WebSettings.LOAD_CACHE_ELSE_NETWORK : WebSettings.LOAD_DEFAULT);
                  if (desktopUa) {
                      s.setUserAgentString(DESKTOP_UA);
                  }
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
              }

              private LinearLayout buildTopToolbar() {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(180, 15, 23, 42));
                  bg.setCornerRadius(dp(20));
                  bar.setBackground(bg);
                  bar.setPadding(dp(8), dp(4), dp(8), dp(4));

                  bar.addView(makeTopBtn("◀ Меню", v -> finish()));

                  final Button joyBtn = makeTopBtn("🎮 Джойстик: ВКЛ", null);
                  joyBtn.setOnClickListener(v -> {
                      joystickVisible = !joystickVisible;
                      controlsOverlay.setVisibility(joystickVisible ? View.VISIBLE : View.GONE);
                      joyBtn.setText(joystickVisible ? "🎮 Джойстик: ВКЛ" : "🎮 Джойстик: ВЫКЛ");
                  });
                  bar.addView(joyBtn);

                  final Button modeBtn = makeTopBtn("⌨️ WASD", null);
                  modeBtn.setOnClickListener(v -> {
                      releaseAllDirections();
                      arrowMode = !arrowMode;
                      modeBtn.setText(arrowMode ? "⌨️ Стрелки" : "⌨️ WASD");
                  });
                  bar.addView(modeBtn);

                  final Button uaBtn = makeTopBtn(desktopUa ? "🖥️ ПК UA" : "📱 Моб UA", null);
                  uaBtn.setOnClickListener(v -> {
                      desktopUa = !desktopUa;
                      webView.getSettings().setUserAgentString(desktopUa ? DESKTOP_UA : null);
                      uaBtn.setText(desktopUa ? "🖥️ ПК UA" : "📱 Моб UA");
                      webView.reload();
                  });
                  bar.addView(uaBtn);

                  return bar;
              }

              private Button makeTopBtn(String text, View.OnClickListener listener) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(11);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(Color.TRANSPARENT);
                  b.setPadding(dp(8), 0, dp(8), 0);
                  b.setMinimumHeight(dp(30));
                  b.setMinHeight(dp(30));
                  if (listener != null) b.setOnClickListener(listener);
                  return b;
              }

              private void buildVirtualControls() {
                  VirtualJoystickView joystick = new VirtualJoystickView(this);
                  FrameLayout.LayoutParams joyLp = new FrameLayout.LayoutParams(dp(160), dp(160));
                  joyLp.gravity = Gravity.BOTTOM | Gravity.START;
                  joyLp.leftMargin = dp(20);
                  joyLp.bottomMargin = dp(20);
                  joystick.setJoystickListener((x, y) -> handleJoystick(x, y));
                  controlsOverlay.addView(joystick, joyLp);

                  LinearLayout rightPad = new LinearLayout(this);
                  rightPad.setOrientation(LinearLayout.VERTICAL);
                  rightPad.setGravity(Gravity.END);

                  LinearLayout row1 = new LinearLayout(this);
                  row1.setOrientation(LinearLayout.HORIZONTAL);
                  row1.addView(makeKeyButton("ESC", "Escape", 27, 0xFF475569));
                  row1.addView(makeKeyButton("R", "KeyR", 82, 0xFF6366F1));
                  row1.addView(makeKeyButton("C", "KeyC", 67, 0xFF6366F1));

                  LinearLayout row2 = new LinearLayout(this);
                  row2.setOrientation(LinearLayout.HORIZONTAL);
                  row2.addView(makeKeyButton("F (Авто)", "KeyF", 70, 0xFF0EA5E9));
                  row2.addView(makeKeyButton("SHIFT", "ShiftLeft", 16, 0xFFF59E0B));

                  LinearLayout row3 = new LinearLayout(this);
                  row3.setOrientation(LinearLayout.HORIZONTAL);
                  row3.addView(makeKeyButton("SPACE", "Space", 32, 0xFF10B981));
                  row3.addView(makeKeyButton("ОГОНЬ", "ControlLeft", 17, 0xFFEF4444));

                  rightPad.addView(row1);
                  rightPad.addView(row2);
                  rightPad.addView(row3);

                  FrameLayout.LayoutParams padLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  padLp.gravity = Gravity.BOTTOM | Gravity.END;
                  padLp.rightMargin = dp(18);
                  padLp.bottomMargin = dp(18);
                  controlsOverlay.addView(rightPad, padLp);
              }

              private Button makeKeyButton(String label, final String code, final int keyCode, int color) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setTextSize(11);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.argb(175, Color.red(color), Color.green(color), Color.blue(color)));
                  bg.setCornerRadius(dp(18));
                  bg.setStroke(dp(1), Color.argb(180, 255, 255, 255));
                  b.setBackground(bg);

                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(74), dp(46));
                  lp.setMargins(dp(5), dp(5), dp(5), dp(5));
                  b.setLayoutParams(lp);

                  b.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          v.setAlpha(0.6f);
                          sendJsKey("keydown", code, keyCode);
                          return true;
                      } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                          v.setAlpha(1.0f);
                          sendJsKey("keyup", code, keyCode);
                          return true;
                      }
                      return false;
                  });
                  return b;
              }

              private void handleJoystick(float x, float y) {
                  float threshold = 0.30f;
                  String upCode = arrowMode ? "ArrowUp" : "KeyW";
                  int upKey = arrowMode ? 38 : 87;
                  String downCode = arrowMode ? "ArrowDown" : "KeyS";
                  int downKey = arrowMode ? 40 : 83;
                  String leftCode = arrowMode ? "ArrowLeft" : "KeyA";
                  int leftKey = arrowMode ? 37 : 65;
                  String rightCode = arrowMode ? "ArrowRight" : "KeyD";
                  int rightKey = arrowMode ? 39 : 68;

                  updateKeyState(upCode, upKey, y < -threshold);
                  updateKeyState(downCode, downKey, y > threshold);
                  updateKeyState(leftCode, leftKey, x < -threshold);
                  updateKeyState(rightCode, rightKey, x > threshold);
              }

              private void updateKeyState(String code, int keyCode, boolean pressed) {
                  boolean wasPressed = activeKeys.contains(code);
                  if (pressed && !wasPressed) {
                      activeKeys.add(code);
                      sendJsKey("keydown", code, keyCode);
                  } else if (!pressed && wasPressed) {
                      activeKeys.remove(code);
                      sendJsKey("keyup", code, keyCode);
                  }
              }

              private void releaseAllDirections() {
                  for (String code : new HashSet<>(activeKeys)) {
                      sendJsKey("keyup", code, 0);
                  }
                  activeKeys.clear();
              }

              private void sendJsKey(String type, String code, int keyCode) {
                  String key = code.replace("Key", "").replace("Arrow", "");
                  if ("Space".equals(code)) key = " ";
                  if ("ControlLeft".equals(code)) key = "Control";
                  if ("ShiftLeft".equals(code)) key = "Shift";
                  if ("Escape".equals(code)) key = "Escape";

                  String js = "javascript:(function(){var e=new KeyboardEvent('" + type + "',{key:'" + key + "',code:'" + code + "',keyCode:" + keyCode + ",which:" + keyCode + ",bubbles:true,cancelable:true});document.dispatchEvent(e);window.dispatchEvent(e);var c=document.querySelector('canvas');if(c)c.dispatchEvent(e);})();";
                  webView.evaluateJavascript(js, null);
              }

              private void hideSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION);
              }

              private int dp(int val) {
                  return Math.round(val * getResources().getDisplayMetrics().density);
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "GTA PORTS LAUNCHER.apk"

      - name: Upload GTA PORTS LAUNCHER.apk
        uses: actions/upload-artifact@v4
        with:
          name: GTA PORTS LAUNCHER
          path: GTA PORTS LAUNCHER.apk
