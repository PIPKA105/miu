name: FOX GTA PORTS APK v6

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: echo "=== FOX WORKFLOW v6 ACTIVE ==="
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create project
        run: |
          rm -rf build foxplugin
          cordova create build com.foxai.gtaports "GTA PORTS LAUNCHER"
          rm -rf build/www
          mkdir -p build/www foxplugin/www foxplugin/src/android

      - name: Write config and native plugin
        run: |
          cat > foxplugin/package.json <<'FOX_PKG'
          {
            "name": "cordova-plugin-foxlaunch",
            "version": "1.0.0",
            "description": "Launch installed apps, open store and URLs.",
            "cordova": { "id": "cordova-plugin-foxlaunch", "platforms": ["android"] },
            "keywords": ["ecosystem:cordova", "cordova-android"],
            "author": "FoxAI",
            "license": "MIT"
          }
          FOX_PKG
          cat > build/config.xml <<'FOX_CFG'
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.foxai.gtaports" version="6.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>GTA PORTS LAUNCHER</name>
              <description>F-Droid style launcher for GTA ports + built-in joystick game.</description>
              <author href="https://github.com" email="fox@foxai.app">FoxAI</author>
              <content src="index.html" />
              <access origin="*" />
              <preference name="Orientation" value="portrait" />
              <preference name="BackgroundColor" value="0xfffafafa" />
              <preference name="android-minSdkVersion" value="24" />
              <preference name="android-targetSdkVersion" value="34" />
              <preference name="AndroidWindowSplashScreenBackground" value="#1565c0" />
              <preference name="AndroidLaunchMode" value="singleTask" />
              <platform name="android"><icon src="icon.png" /></platform>
          </widget>
          FOX_CFG
          cat > foxplugin/plugin.xml <<'FOX_PLUGIN'
          <?xml version="1.0" encoding="UTF-8"?>
          <plugin xmlns="http://apache.org/cordova/ns/plugins/1.0" id="cordova-plugin-foxlaunch" version="1.0.0">
              <name>FoxLaunch</name>
              <js-module src="www/foxlaunch.js" name="FoxLaunch"><clobbers target="FoxLaunch" /></js-module>
              <platform name="android">
                  <config-file target="res/xml/config.xml" parent="/*">
                      <feature name="FoxLaunch"><param name="android-package" value="com.foxai.foxlaunch.FoxLaunch" /></feature>
                  </config-file>
                  <config-file target="AndroidManifest.xml" parent="/*">
                      <queries>
                          <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                          <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                          <package android:name="com.retroarch" /><package android:name="org.ppsspp.ppsspp" />
                          <package android:name="me.magnum.melonds" /><package android:name="com.winlator" />
                          <package android:name="com.rockstargames.gta3" /><package android:name="com.rockstargames.gtavc" />
                          <package android:name="com.rockstargames.gtasa" /><package android:name="com.rockstargames.gtalcs" />
                          <package android:name="com.rockstargames.gtactw" />
                      </queries>
                  </config-file>
                  <source-file src="src/android/FoxLaunch.java" target-dir="src/com/foxai/foxlaunch" />
              </platform>
          </plugin>
          FOX_PLUGIN
          cat > foxplugin/www/foxlaunch.js <<'FOX_JS'
          var exec = require('cordova/exec');
          module.exports = {
              isInstalled: function (p, ok, fail) { exec(ok, fail, 'FoxLaunch', 'isInstalled', [p]); },
              launch:      function (p, ok, fail) { exec(ok, fail, 'FoxLaunch', 'launch', [p]); },
              openStore:   function (p, ok, fail) { exec(ok, fail, 'FoxLaunch', 'openStore', [p]); },
              openUrl:     function (u, ok, fail) { exec(ok, fail, 'FoxLaunch', 'openUrl', [u]); }
          };
          FOX_JS
          cat > foxplugin/src/android/FoxLaunch.java <<'FOX_JAVA'
          package com.foxai.foxlaunch;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import org.apache.cordova.CallbackContext;
          import org.apache.cordova.CordovaPlugin;
          import org.json.JSONArray;
          import org.json.JSONException;
          public class FoxLaunch extends CordovaPlugin {
              @Override
              public boolean execute(String action, JSONArray args, CallbackContext cb) throws JSONException {
                  String arg = args.getString(0);
                  Context ctx = cordova.getActivity().getApplicationContext();
                  PackageManager pm = ctx.getPackageManager();
                  if (action.equals("isInstalled")) {
                      boolean ok = false;
                      try { pm.getPackageInfo(arg, 0); ok = true; } catch (Exception e) { }
                      cb.success(ok ? 1 : 0); return true;
                  }
                  if (action.equals("launch")) {
                      Intent i = pm.getLaunchIntentForPackage(arg);
                      if (i == null) { cb.error("not_installed"); return true; }
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i); cb.success(); return true;
                  }
                  if (action.equals("openStore")) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + arg));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i);
                      } catch (Exception e) {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("https://play.google.com/store/apps/details?id=" + arg));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i);
                      }
                      cb.success(); return true;
                  }
                  if (action.equals("openUrl")) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(arg));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i); cb.success();
                      } catch (Exception e) { cb.error("cannot_open"); }
                      return true;
                  }
                  return false;
              }
          }
          FOX_JAVA

      - name: Generate icon (no deps)
        run: |
          node - <<'FOX_ICON'
          var zlib=require('zlib'),fs=require('fs'),W=512,H=512,px=Buffer.alloc(W*H*4);
          function P(x,y,r,g,b){if(x<0||y<0||x>=W||y>=H)return;var i=(y*W+x)*4;px[i]=r;px[i+1]=g;px[i+2]=b;px[i+3]=255;}
          var x,y;for(y=0;y<H;y++)for(x=0;x<W;x++){P(x,y,21,101,192);}
          function tri(ax,ay,bx,by,cx,cy,r,g,b){var mnx=Math.min(ax,bx,cx),mxx=Math.max(ax,bx,cx),mny=Math.min(ay,by,cy),mxy=Math.max(ay,by,cy);for(var yy=mny;yy<=mxy;yy++)for(var xx=mnx;xx<=mxx;xx++){var d=(by-cy)*(ax-cx)+(cx-bx)*(ay-cy);var a=((by-cy)*(xx-cx)+(cx-bx)*(yy-cy))/d;var b2=((cy-ay)*(xx-cx)+(ax-cx)*(yy-cy))/d;var c=1-a-b2;if(a>=0&&b2>=0&&c>=0)P(xx,yy,r,g,b);}}
          tri(150,180,362,180,256,402,255,154,61);tri(136,118,226,178,182,224,255,46,136);tri(376,118,286,178,330,224,255,46,136);tri(182,268,330,268,256,402,255,255,255);
          function eye(cx,cy){for(var yy=cy-17;yy<=cy+17;yy++)for(var xx=cx-17;xx<=cx+17;xx++){var a=xx-cx,b=yy-cy;if(a*a+b*b<289)P(xx,yy,21,101,192);}}
          eye(212,242);eye(300,242);
          var crcT=[],n,k;for(n=0;n<256;n++){var c=n;for(k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);crcT[n]=c>>>0;}
          function crc(b){var c=0xFFFFFFFF;for(var i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
          function ch(t,d){var l=Buffer.alloc(4);l.writeUInt32BE(d.length,0);var ty=Buffer.from(t),cr=Buffer.alloc(4);cr.writeUInt32BE(crc(Buffer.concat([ty,d])),0);return Buffer.concat([l,ty,d,cr]);}
          var raw=Buffer.alloc((W*4+1)*H);for(y=0;y<H;y++){raw[y*(W*4+1)]=0;px.copy(raw,y*(W*4+1)+1,y*W*4,(y+1)*W*4);}
          var ih=Buffer.alloc(13);ih.writeUInt32BE(W,0);ih.writeUInt32BE(H,4);ih[8]=8;ih[9]=6;
          fs.writeFileSync('build/icon.png',Buffer.concat([Buffer.from([137,80,78,71,13,10,26,10]),ch('IHDR',ih),ch('IDAT',zlib.deflateSync(raw)),ch('IEND',Buffer.alloc(0))]));
          console.log('icon ok');
          FOX_ICON

      - name: Write www/index.html
        run: |
          cat > build/www/index.html <<'FOX_HTML'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
          <meta name="theme-color" content="#1565c0">
          <title>GTA Ports</title>
          <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Russo+One&display=swap" rel="stylesheet">
          <style>
          :root{--pri:#1565c0;--pri-d:#0d47a1;--bg:#fafafa;--card:#fff;--ink:#212121;--mut:#757575;--line:#e0e0e0;--ok:#2e7d32;--warn:#e65100;--chip:#e3f2fd}
          *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
          body.lock{overflow:hidden}
          button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
          input{font-family:inherit}
          ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#bdbdbd;border-radius:8px}
          #appbar{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--pri);color:#fff;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
          #appbar .ttl{font-size:19px;font-weight:500;flex:1}
          #appbar .ic{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
          #appbar .ic:active{background:rgba(255,255,255,.15)}
          #appbar svg{width:22px;height:22px;fill:#fff}
          #searchWrap{position:fixed;top:56px;left:0;right:0;z-index:99;background:var(--pri);padding:0 12px 10px;display:none}
          #searchWrap.open{display:block}
          #searchInp{width:100%;background:#fff;border:none;border-radius:6px;padding:10px 14px;font-size:15px;color:var(--ink)}
          main{padding:66px 0 70px;max-width:760px;margin:0 auto}
          .view{display:none}.view.active{display:block}
          .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
          .cat{flex:none;padding:7px 16px;border-radius:999px;background:var(--chip);color:var(--pri);font-size:13px;font-weight:500}
          .cat.on{background:var(--pri);color:#fff}
          .sec{padding:6px 16px;font-size:13px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
          .row{display:flex;gap:14px;align-items:center;background:var(--card);padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
          .row:active{background:#f0f0f0}
          .row .logo{width:56px;height:56px;flex:none;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.2)}
          .row .logo svg{width:100%;height:100%;display:block}
          .row .txt{flex:1;min-width:0}
          .row .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .row .sm{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .row .mt{font-size:12px;color:var(--mut);margin-top:2px}
          .row .st{color:var(--ok);font-weight:500}
          .empty{text-align:center;padding:60px 20px;color:var(--mut)}
          .empty b{display:block;font-size:40px;margin-bottom:8px}
          .notice{margin:12px 16px;background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:12px 14px;font-size:13px;color:#5d4037}
          .notice b{color:var(--warn)}
          #detail{position:fixed;inset:0;z-index:150;background:var(--bg);display:none;overflow-y:auto}
          #detail.open{display:block}
          .d-bar{position:sticky;top:0;background:var(--pri);color:#fff;height:56px;display:flex;align-items:center;gap:8px;padding:0 8px;z-index:5}
          .d-bar .back{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
          .d-bar .back svg{width:24px;height:24px;fill:#fff}
          .d-bar .t{font-size:17px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .d-head{display:flex;gap:16px;padding:16px;background:var(--card);border-bottom:1px solid var(--line)}
          .d-head .logo{width:80px;height:80px;flex:none;border-radius:16px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25)}
          .d-head .logo svg{width:100%;height:100%}
          .d-head h1{font-size:19px;font-weight:500;line-height:1.25}
          .d-head .dev{color:var(--pri);font-size:13px;margin-top:3px}
          .d-head .cat{display:inline-block;margin-top:6px;font-size:11px}
          .d-act{padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:10px}
          .btn-install{flex:1;background:var(--pri);color:#fff;font-weight:500;font-size:15px;padding:12px;border-radius:6px;text-transform:uppercase;letter-spacing:.5px}
          .btn-install.open{background:var(--ok)}
          .btn-install:active{opacity:.85}
          .btn-fav{width:48px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center}
          .btn-fav svg{width:22px;height:22px;fill:none;stroke:var(--mut);stroke-width:2}
          .btn-fav.on svg{fill:var(--pri);stroke:var(--pri)}
          .shots{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}.shots::-webkit-scrollbar{display:none}
          .shots .sh{flex:none;width:260px;height:150px;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.2)}
          .shots .sh svg{width:100%;height:100%;display:block}
          .d-sec{background:var(--card);margin-top:8px;padding:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
          .d-sec h2{font-size:15px;font-weight:500;margin-bottom:8px}
          .d-sec p{font-size:14px;color:#424242}
          .info{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .info div span{display:block;font-size:12px;color:var(--mut)}
          .info div b{font-size:14px;font-weight:500}
          .anti{background:#fff3e0;border:1px solid #ffe0b2;border-radius:8px;padding:12px;font-size:13px;color:#5d4037;margin-top:10px}
          .src{display:inline-block;margin-top:10px;color:var(--pri);font-size:14px;font-weight:500}
          #bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
          .nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px}
          .nav svg{width:24px;height:24px;fill:currentColor}
          .nav.on{color:var(--pri)}
          .game-hero{margin:12px 16px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
          .game-hero svg{width:100%;display:block}
          .game-desc{margin:0 16px 12px;color:#424242;font-size:14px}
          .game-btn{margin:0 16px 16px;width:calc(100% - 32px);background:var(--ok);color:#fff;font-weight:500;font-size:15px;padding:14px;border-radius:6px;text-transform:uppercase}
          .runs{margin:0 16px}
          .run{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
          .run b{margin-left:auto;color:var(--pri);font-weight:700}
          #toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:300;width:min(92%,420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
          .toast{background:#323232;color:#fff;border-radius:6px;padding:12px 16px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.3)}
          #gameOverlay{position:fixed;inset:0;z-index:200;background:#0b0620;display:none}
          #gameOverlay.open{display:block}
          #gameCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
          .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(5,2,15,.6))}
          #hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;opacity:0;pointer-events:none;color:#fff}
          #gameOverlay.play #hud{opacity:1;pointer-events:auto}
          .hbtn{width:42px;height:42px;border-radius:50%;background:rgba(20,10,46,.85);border:1px solid rgba(0,229,255,.4);color:#00e5ff;font-size:16px}
          .hud-center{text-align:center}
          #hCash{font-family:"Russo One";font-size:18px;color:#3dff9a}
          #hTime{font-family:"Russo One";font-size:14px;color:#00e5ff}#hTime.low{color:#ff4d5e}
          .hpwrap{width:150px;height:8px;background:#241650;border-radius:99px;margin:7px auto 0;overflow:hidden}
          #hpFill{height:100%;width:100%;background:linear-gradient(90deg,#3dff9a,#00e5ff)}#hpFill.low{background:linear-gradient(90deg,#ff4d5e,#ffd23d)}
          #hStars{color:#ffd23d;font-size:14px}
          #mm{position:absolute;top:96px;right:12px;border:1px solid rgba(0,229,255,.45);border-radius:12px;opacity:0}
          #gameOverlay.play #mm{opacity:.92}
          #joyZone{position:absolute;left:0;bottom:0;width:58%;height:46%;touch-action:none;opacity:0;pointer-events:none}
          #gameOverlay.play #joyZone{opacity:1;pointer-events:auto}
          #joyBase{position:absolute;left:26px;bottom:26px;width:116px;height:116px;border-radius:50%;border:2px solid rgba(0,229,255,.5);background:radial-gradient(circle,rgba(0,229,255,.14),rgba(0,229,255,.03))}
          #joyBase.active{border-color:#00e5ff}
          #joyThumb{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#7b2fff);transition:transform .12s}
          #joyBase.active #joyThumb{transition:none}
          #nitroBtn{position:absolute;right:22px;bottom:34px;width:92px;height:92px;border-radius:50%;border:2px solid rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center;touch-action:none;opacity:0;pointer-events:none}
          #gameOverlay.play #nitroBtn{opacity:1;pointer-events:auto}
          .nlabel{width:74px;height:74px;border-radius:50%;background:rgba(11,6,32,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Russo One";font-size:11px;color:#00e5ff}
          .gpanel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,2,15,.55);opacity:0;pointer-events:none;overflow-y:auto}
          .gpanel.show{opacity:1;pointer-events:auto}
          .gcard{width:min(100%,420px);background:linear-gradient(180deg,#1a1038,#140a2e);border:1px solid rgba(255,46,136,.45);border-radius:22px;padding:24px 22px;text-align:center;color:#f4eeff}
          .gcard h2{font-family:"Russo One";font-size:26px;background:linear-gradient(90deg,#00e5ff,#ff2e88);-webkit-background-clip:text;background-clip:text;color:transparent}
          .gsub{font-size:12.5px;color:#9d8fc7;margin-top:8px}
          #diffRow{display:flex;gap:8px;justify-content:center;margin:16px 0 6px}
          .diffchip{padding:10px 15px;border-radius:12px;border:1px solid #241650;background:#1a1038;font-family:"Russo One";font-size:12px;color:#9d8fc7}
          .diffchip.on{border-color:#00e5ff;color:#00e5ff}
          #diffInfo{font-size:12px;color:#9d8fc7}
          #vibroBtn{margin:12px auto 0;display:block;padding:9px 16px;border-radius:12px;background:#241650;font-size:12px;font-weight:700;color:#9d8fc7}#vibroBtn.on{color:#3dff9a}
          .bigbtn{width:100%;margin-top:16px;padding:16px;font-family:"Russo One";font-size:16px;border-radius:12px;background:linear-gradient(135deg,#ff9a3d,#ff2e88);color:#fff}
          .ghint{font-size:11px;color:#9d8fc7;margin-top:14px;line-height:1.6}
          #endTitle{font-family:"Russo One";font-size:24px}
          #endTitle.win{color:#3dff9a}#endTitle.lose{color:#ff4d5e}
          #endRecord{display:none;width:max-content;margin:10px auto 0;background:rgba(255,210,61,.14);border:1px solid rgba(255,210,61,.5);color:#ffd23d;font-size:12px;font-weight:700;padding:6px 14px;border-radius:999px}
          #endStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
          #endStats div{background:#1a1038;border-radius:12px;padding:10px 6px}
          #endStats span{display:block;font-size:9px;color:#9d8fc7}#endStats b{font-family:"Russo One";font-size:17px;color:#00e5ff}
          .endrow{display:flex;gap:10px;margin-top:14px}.endrow button{flex:1;padding:12px;border-radius:12px;font-weight:700}
          .endrow .a{background:linear-gradient(135deg,#ff9a3d,#ff2e88);color:#fff}.endrow .b{background:#241650;color:#f4eeff}
          .gbtn-cyan{width:100%;margin-top:16px;padding:16px;border-radius:12px;background:linear-gradient(135deg,#00e5ff,#3d7bff);color:#04122a;font-family:"Russo One";font-size:16px}
          </style>
          </head>
          <body>
          <header id="appbar">
            <div class="ttl" id="barTitle">GTA Ports</div>
            <button class="ic" id="searchToggle" aria-label="Поиск"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></button>
          </header>
          <div id="searchWrap"><input id="searchInp" type="search" placeholder="Поиск по каталогу…"></div>
          <main>
            <section id="view-catalog" class="view active">
              <div class="cats" id="cats"></div>
              <div class="notice">🦊 <b>FoxAI:</b> пиратские «port.apk» не подключаем — вирусы и права. Кнопка «Установить» ведёт туда, где игра реально скачивается и запускается.</div>
              <div class="sec" id="count"></div>
              <div id="list"></div>
            </section>
            <section id="view-game" class="view">
              <div class="game-hero" id="gameHero"></div>
              <p class="game-desc">FOX CITY — встроенная игра лаунчера: неоновый город, рыжая тачка, касса и копы. Джойстик слева, нитро справа. Играется сразу, без загрузок. 🦊</p>
              <button class="game-btn" data-act="open-game">▶ Играть в FOX CITY</button>
              <div class="sec">Последние заезды</div>
              <div class="runs" id="runsList"></div>
            </section>
            <section id="view-favs" class="view">
              <div class="sec">Избранное</div>
              <div id="favList"></div>
              <div class="empty" id="favEmpty"><b>☆</b>Пока пусто. Жми ☆ на странице игры.</div>
            </section>
          </main>
          <nav id="bottomnav">
            <button class="nav on" data-act="nav" data-view="catalog"><svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>Каталог</button>
            <button class="nav" data-act="nav" data-view="game"><svg viewBox="0 0 24 24"><path d="M21 6H3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zM11 13H8v3H6v-3H3v-2h3V8h2v3h3zm4.5 2a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5zm4-3a1.5 1.5 0 1 1 1.5-1.5 1.5 1.5 0 0 1-1.5 1.5z"/></svg>FOX CITY</button>
            <button class="nav" data-act="nav" data-view="favs"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>Избранное</button>
          </nav>
          <div id="detail"></div>
          <div id="gameOverlay">
            <canvas id="gameCanvas"></canvas><div class="vignette"></div>
            <div id="hud"><button class="hbtn" data-act="exit-game">✕</button><div class="hud-center"><div id="hCash">$0</div><div id="hTime">01:30</div><div class="hpwrap"><div id="hpFill"></div></div><div id="hStars">☆☆☆☆☆</div></div><button class="hbtn" data-act="pause">⏸</button></div>
            <canvas id="mm" width="110" height="110"></canvas>
            <div id="joyZone"><div id="joyBase"><div id="joyThumb"></div></div></div>
            <button id="nitroBtn"><span class="nlabel">🔥<br>НИТРО</span></button>
            <div class="gpanel" id="startPanel"><div class="gcard"><h2>FOX CITY</h2><div class="gsub">Собери кассу и уйди от полиции 🦊</div><div id="diffRow"><button class="diffchip" data-act="diff" data-diff="easy">ЛЕГКО</button><button class="diffchip on" data-act="diff" data-diff="norm">НОРМА</button><button class="diffchip" data-act="diff" data-diff="hard">ХАРД</button></div><div id="diffInfo"></div><button id="vibroBtn" data-act="vibro" class="on">📳 Вибро: вкл</button><button class="bigbtn" data-act="start-game">🚦 ПОЕХАЛИ</button><div class="ghint">🕹️ джойстик слева • 🔥 нитро справа<br>ПК: WASD, Shift — нитро, P — пауза<br>Рекорд: <b id="startBest">0</b></div></div></div>
            <div class="gpanel" id="pausePanel"><div class="gcard"><h2>ПАУЗА</h2><div class="gsub">Город подождёт 😏</div><button class="gbtn-cyan" data-act="resume">▶ ПРОДОЛЖИТЬ</button><div class="endrow"><button class="b" data-act="restart">↻ Заново</button><button class="b" data-act="exit-game">🚪 Выход</button></div></div></div>
            <div class="gpanel" id="endPanel"><div class="gcard"><h2 id="endTitle">ИТОГ</h2><div class="gsub" id="endSub"></div><div id="endRecord">🏆 НОВЫЙ РЕКОРД!</div><div id="endStats"></div><div class="endrow"><button class="a" data-act="restart">↻ ЕЩЁ РАЗ</button><button class="b" data-act="exit-game">🚪 Выход</button></div></div></div>
          </div>
          <div id="toasts"></div>
          <script src="cordova.js"></script>
          <script>
          function el(id){return document.getElementById(id);}
          var store={get:function(k,d){try{var v=localStorage.getItem('fox_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:function(k,v){try{localStorage.setItem('fox_'+k,JSON.stringify(v));}catch(e){}}};
          function hash(s){var h=9;for(var i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),387420489);return h>>>0;}
          function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
          function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
          function angDiff(a,b){return ((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;}
          function lerpAngle(a,b,t){return a+angDiff(a,b)*t;}
          function fmtTime(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),q=s%60;return (m<10?'0':'')+m+':'+(q<10?'0':'')+q;}
          function buzz(p){if(S.vibro&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
          var RA={kind:'store',pkg:'com.retroarch',store:'https://play.google.com/store/apps/details?id=com.retroarch'};
          var PP={kind:'store',pkg:'org.ppsspp.ppsspp',store:'https://play.google.com/store/apps/details?id=org.ppsspp.ppsspp'};
          var MD={kind:'store',pkg:'me.magnum.melonds',store:'https://play.google.com/store/apps/details?id=me.magnum.melonds'};
          var WL={kind:'url',url:'https://github.com/brunodev85/winlator/releases'};
          function RS(pkg){return {kind:'store',pkg:pkg,store:'https://play.google.com/store/apps/details?id='+pkg};}
          var GAMES=[
          {id:'sa',name:'GTA: San Andreas',dev:'Rockstar Games',year:2004,cat:'Экшен',label:'SA',c1:'#f7941d',c2:'#c2185b',rating:4.6,size:'2.6 ГБ',ver:'2.11.32',lic:'Проприетарная',install:RS('com.rockstargames.gtasa'),summary:'Штат San Andreas, три города и история CJ.',desc:'Самый большой порт серии. Открытый мир, сюжет на 30+ часов, поддержка геймпада. Мобильная версия 2014 года хорошо идёт на бюджетных телефонах.',need:''},
          {id:'vc',name:'GTA: Vice City',dev:'Rockstar Games',year:2002,cat:'Экшен',label:'VC',c1:'#ff2e88',c2:'#00bcd4',rating:4.5,size:'1.5 ГБ',ver:'1.12',lic:'Проприетарная',install:RS('com.rockstargames.gtavc'),summary:'Неон, пальмы и 80-е. Tommy Vercetti.',desc:'Самый стильный порт: неоновый Vice City, саундтрек 80-х и история Томми Версетти. Легче ремастеров, работает на старых устройствах.',need:''},
          {id:'iii',name:'GTA: III',dev:'Rockstar Games',year:2001,cat:'Экшен',label:'III',c1:'#3d7bff',c2:'#7b2fff',rating:4.3,size:'1.2 ГБ',ver:'1.6',lic:'Проприетарная',install:RS('com.rockstargames.gta3'),summary:'Мрачный Liberty City, с чего всё началось.',desc:'Первая 3D-GTA. Liberty City, немой герой и чистая криминальная классика. Компактная и быстрая.',need:''},
          {id:'lcs',name:'GTA: Liberty City Stories',dev:'Rockstar Games',year:2005,cat:'Экшен',label:'LCS',c1:'#00bcd4',c2:'#3d7bff',rating:4.2,size:'1.8 ГБ',ver:'1.09',lic:'Проприетарная',install:RS('com.rockstargames.gtalcs'),summary:'Приквел III: Тони Сиприани, 1998 год.',desc:'Порт с PSP. Liberty City 1998 года, миссии с мотоциклами и хорошая оптимизация.',need:''},
          {id:'ctw',name:'GTA: Chinatown Wars',dev:'Rockstar Games',year:2009,cat:'Аркада',label:'CTW',c1:'#ffd23d',c2:'#7cb342',rating:4.4,size:'0.9 ГБ',ver:'1.04',lic:'Проприетарная',install:RS('com.rockstargames.gtactw'),summary:'Вид сверху, триады, мини-игры.',desc:'Самая лёгкая официальная GTA. Вид сверху, отличный геймплей и производительность.',need:''},
          {id:'gta1',name:'GTA (1997) + London',dev:'Rockstar / DMA',year:1997,cat:'Классика',label:'1',c1:'#7cb342',c2:'#ffd23d',rating:4.0,size:'эмулятор ~90 МБ',ver:'PS1',lic:'Freeware (PC)',install:RA,summary:'Та самая первая GTA, вид сверху.',desc:'GTA 1997 и аддон London 1969/1961. PC-версия была официальной freeware. На телефоне — через эмулятор PS1 (RetroArch, ядро PCSX).',need:'Эмулятор ставится кнопкой. Для игры нужен образ со своего диска PS1 (или freeware-релиз PC).'},
          {id:'gta2',name:'GTA 2',dev:'Rockstar / DMA',year:1999,cat:'Классика',label:'2',c1:'#00bcd4',c2:'#7cb342',rating:4.1,size:'эмулятор ~90 МБ',ver:'PS1',lic:'Freeware (PC)',install:RA,summary:'Город будущего, банды и уважение.',desc:'GTA 2: три банды, система уважения. PC был freeware; на телефоне — PS1-эмуляция.',need:'Эмулятор ставится кнопкой. Нужен образ своей копии.'},
          {id:'advance',name:'GTA: Advance',dev:'Digital Eclipse',year:2004,cat:'Классика',label:'A',c1:'#ffd23d',c2:'#f7941d',rating:3.9,size:'эмулятор ~90 МБ',ver:'GBA',lic:'Проприетарная',install:RA,summary:'Единственная GTA для Game Boy Advance.',desc:'Изометрическая GTA для GBA, история Майка. Официального мобильного порта нет — играется через эмулятор GBA (RetroArch, ядро mGBA).',need:'Эмулятор ставится кнопкой. Нужен дамп своего картриджа GBA.'},
          {id:'vcs',name:'GTA: Vice City Stories',dev:'Rockstar Leeds',year:2006,cat:'Экшен',label:'VCS',c1:'#ff2e88',c2:'#ffd23d',rating:4.3,size:'эмулятор ~25 МБ',ver:'PSP',lic:'Проприетарная',install:PP,summary:'Вик Вэнс, 1984 год. Только эмуляция.',desc:'Официального мобильного порта VCS не существует. Играется через PPSSPP (PSP) — лёгкий эмулятор ~25 МБ.',need:'PPSSPP ставится кнопкой. Нужен ISO со своего UMD.'},
          {id:'iv',name:'GTA: IV',dev:'Rockstar North',year:2008,cat:'Экшен',label:'IV',c1:'#7986cb',c2:'#3d7bff',rating:4.4,size:'Winlator ~400 МБ',ver:'PC',lic:'Проприетарная',install:WL,summary:'Liberty City HD. Только Winlator + PC-копия.',desc:'Нативного Android-порта IV нет. Реальный путь — Winlator (Wine+Box64) со своей PC-копией, нужно мощное железо (Snapdragon 8xx).',need:'Winlator качается с GitHub. Нужна своя PC-копия GTA IV и топ-телефон.'},
          {id:'eflc',name:'GTA: Episodes from LC',dev:'Rockstar North',year:2009,cat:'Экшен',label:'EFLC',c1:'#3d7bff',c2:'#00bcd4',rating:4.3,size:'Winlator ~400 МБ',ver:'PC',lic:'Проприетарная',install:WL,summary:'TLAD и TBoGT — два эпизода.',desc:'The Lost and Damned и The Ballad of Gay Tony. Всё как с IV: Winlator + своя PC-копия.',need:'Winlator с GitHub + своя PC-копия EFLC.'},
          {id:'v',name:'GTA: V (облако)',dev:'Rockstar North',year:2013,cat:'Облако',label:'V',c1:'#7cb342',c2:'#00bcd4',rating:4.6,size:'0 МБ (стрим)',ver:'Cloud',lic:'Подписка',install:{kind:'url',url:'https://www.xbox.com/play'},summary:'Без нагрузки на телефон — стрим Xbox.',desc:'Мобильного порта V нет, все «GTA5.apk» — фейки. Лёгкий честный путь — облако Xbox: игра стримится, телефон не греется.',need:'Нужна подписка Game Pass Ultimate и GTA V в каталоге облака (ротация).'}
          ];
          var CATS=['Все','Экшен','Классика','Аркада','Облако'];
          var S={view:'catalog',q:'',cat:'Все',favs:store.get('favs',[]),installed:{},sound:store.get('sound',true),vibro:store.get('vibro',true),best:store.get('best',0),runs:store.get('runs',[])};
          function byId(id){for(var i=0;i<GAMES.length;i++)if(GAMES[i].id===id)return GAMES[i];return null;}
          function logoSVG(g){return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lg'+g.id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+g.c1+'"/><stop offset="1" stop-color="'+g.c2+'"/></linearGradient></defs><rect width="100" height="100" fill="url(#lg'+g.id+')"/><rect x="0" y="66" width="100" height="34" fill="rgba(0,0,0,0.25)"/><text x="50" y="52" text-anchor="middle" font-family="Russo One,sans-serif" font-size="'+(g.label.length>3?22:34)+'" fill="#fff">'+g.label+'</text><text x="50" y="86" text-anchor="middle" font-family="Roboto,sans-serif" font-size="10" letter-spacing="2" fill="rgba(255,255,255,0.9)">GTA</text></svg>';}
          function posterSVG(g,variant){var r=mulberry(hash(g.id)+variant*7),b='',w='',i,wx,wy;for(i=0;i<13;i++){var bw=20+r()*30,bh=36+r()*110,bx=8+i*46+r()*8,by=208-bh;b+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="#130a2c" stroke="'+g.c1+'" stroke-opacity="0.55"/>';for(wy=by+7;wy<200;wy+=14)for(wx=bx+4;wx<bx+bw-5;wx+=10)if(r()<0.42)w+='<rect x="'+wx.toFixed(1)+'" y="'+wy.toFixed(1)+'" width="4" height="6" fill="'+(r()<0.5?g.c1:g.c2)+'" opacity="0.85"/>';}var gr='';for(i=0;i<=12;i++){var x=i*50;gr+='<line x1="'+(300+(x-300)*0.25)+'" y1="208" x2="'+x+'" y2="340" stroke="'+g.c2+'" stroke-opacity="0.35"/>';}for(i=0;i<6;i++){var y=208+Math.pow(i/5,1.7)*132;gr+='<line x1="0" y1="'+y.toFixed(1)+'" x2="600" y2="'+y.toFixed(1)+'" stroke="'+g.c2+'" stroke-opacity="0.3"/>';}var st='';for(i=0;i<5;i++)st+='<rect x="210" y="'+(150+i*14)+'" width="180" height="'+(4+i*1.5)+'" fill="url(#sky'+g.id+variant+')"/>';var cap=['','ГЕЙМПЛЕЙ','КАРТА'][variant]||'';return '<svg viewBox="0 0 600 340" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="sky'+g.id+variant+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="340"><stop offset="0" stop-color="#0d0620"/><stop offset="0.6" stop-color="'+g.c2+'" stop-opacity="0.4"/><stop offset="1" stop-color="#1b0b3a"/></linearGradient><linearGradient id="sun'+g.id+variant+'" gradientUnits="userSpaceOnUse" x1="0" y1="72" x2="0" y2="228"><stop offset="0" stop-color="#ffd23d"/><stop offset="1" stop-color="'+g.c1+'"/></linearGradient></defs><rect width="600" height="340" fill="url(#sky'+g.id+variant+')"/><circle cx="300" cy="150" r="78" fill="url(#sun'+g.id+variant+')"/>'+st+'<rect x="0" y="204" width="600" height="6" fill="'+g.c1+'" opacity="0.5"/>'+b+w+gr+'<text x="300" y="290" text-anchor="middle" font-family="Russo One,sans-serif" font-size="30" letter-spacing="2" fill="#fff">'+g.label+'</text><text x="300" y="315" text-anchor="middle" font-family="Roboto,sans-serif" font-size="12" letter-spacing="3" fill="'+g.c1+'">'+(cap||g.dev.toUpperCase())+'</text></svg>';}
          function isInst(g){return g.install.kind==='store'&&g.install.pkg&&S.installed[g.install.pkg];}
          function rowHTML(g){var fav=S.favs.indexOf(g.id)>-1;return '<div class="row" data-act="info" data-id="'+g.id+'"><div class="logo">'+logoSVG(g)+'</div><div class="txt"><div class="nm">'+g.name+'</div><div class="sm">'+g.summary+'</div><div class="mt"><span class="st">★ '+g.rating.toFixed(1)+'</span> • '+g.size+(isInst(g)?' • <span class="st">установлено</span>':'')+'</div></div></div>';}
          function filtered(){var l=GAMES.slice(),q=S.q.trim().toLowerCase();if(q)l=l.filter(function(g){return (g.name+' '+g.summary+' '+g.dev).toLowerCase().indexOf(q)>-1;});if(S.cat!=='Все')l=l.filter(function(g){return g.cat===S.cat;});return l;}
          function renderCats(){el('cats').innerHTML=CATS.map(function(c){return '<button class="cat'+(c===S.cat?' on':'')+'" data-act="cat" data-cat="'+c+'">'+c+'</button>';}).join('');}
          function renderList(){var l=filtered();el('count').textContent=l.length+' приложений';el('list').innerHTML=l.length?l.map(rowHTML).join(''):'<div class="empty"><b>🔍</b>Ничего не найдено</div>';}
          function renderFavs(){var l=GAMES.filter(function(g){return S.favs.indexOf(g.id)>-1;});el('favList').innerHTML=l.map(rowHTML).join('');el('favEmpty').style.display=l.length?'none':'block';}
          function detailHTML(g){var fav=S.favs.indexOf(g.id)>-1,inst=isInst(g);var shots=[0,1,2].map(function(v){return '<div class="sh">'+posterSVG(g,v)+'</div>';}).join('');var src=g.install.store||g.install.url;return '<div class="d-bar"><button class="back" data-act="close-detail"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button><div class="t">'+g.name+'</div></div>'
          +'<div class="d-head"><div class="logo">'+logoSVG(g)+'</div><div><h1>'+g.name+'</h1><div class="dev">'+g.dev+'</div><span class="cat cat on" style="background:var(--chip);color:var(--pri)">'+g.cat+'</span></div></div>'
          +'<div class="d-act"><button class="btn-install'+(inst?' open':'')+'" data-act="'+(inst?'open':'install')+'" data-id="'+g.id+'">'+(inst?'Открыть':'Установить')+'</button><button class="btn-fav'+(fav?' on':'')+'" data-act="fav" data-id="'+g.id+'"><svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button></div>'
          +'<div class="shots">'+shots+'</div>'
          +'<div class="d-sec"><h2>Описание</h2><p>'+g.desc+'</p>'+(g.need?'<div class="anti">⚠️ '+g.need+'</div>':'')+'</div>'
          +'<div class="d-sec"><h2>Информация</h2><div class="info"><div><span>Версия</span><b>'+g.ver+'</b></div><div><span>Размер</span><b>'+g.size+'</b></div><div><span>Лицензия</span><b>'+g.lic+'</b></div><div><span>Год</span><b>'+g.year+'</b></div><div><span>Категория</span><b>'+g.cat+'</b></div><div><span>Оценка</span><b>★ '+g.rating.toFixed(1)+'</b></div></div><a class="src" data-act="link" data-url="'+src+'">Источник / страница загрузки ↗</a></div>';}
          function openDetail(g){if(!g)return;el('detail').innerHTML=detailHTML(g);el('detail').classList.add('open');el('detail').scrollTop=0;document.body.classList.add('lock');}
          function closeDetail(){el('detail').classList.remove('open');if(!overlayOpen)document.body.classList.remove('lock');}
