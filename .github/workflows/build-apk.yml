                              public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest req) {
                                  String targetUrl = req.getUrl().toString();
                                  if (!targetUrl.contains("doubleclick") && !targetUrl.contains("googlesyndication")) {
